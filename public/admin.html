<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXUS — Panel Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07080c;color:#eee;font-family:Arial}.wrap{max-width:1000px;margin:auto;padding:18px}
.logo{font-size:34px;font-weight:900;letter-spacing:6px;color:#8b5cf6}.top{display:flex;gap:8px;margin:18px 0}.top input{flex:1}
input,textarea{background:#10121a;border:1px solid #303343;color:#fff;padding:12px;border-radius:10px}button{border:0;border-radius:10px;padding:12px 15px;font-weight:800;cursor:pointer}
.primary{background:#7c3aed;color:#fff}.approve{background:#16a34a;color:#fff}.reject{background:#dc2626;color:#fff}.muted{color:#9ca3af}
.card{background:#11131a;border:1px solid #272a38;border-radius:16px;padding:17px;margin:12px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
textarea{width:100%;min-height:60px;margin-top:8px}.tag{padding:4px 8px;border-radius:8px;font-size:12px;background:#272a38}
</style></head><body><div class="wrap">
<div class="logo">NEXUS ADMIN</div><p class="muted">Panel privado de solicitudes.</p>
<div class="top"><input id="key" type="password" placeholder="Clave de administrador"><button class="primary" onclick="load()">CARGAR</button></div>
<div id="list"></div>
</div>
<script>
let key="";
async function load(){
 key=document.getElementById("key").value;
 const r=await fetch("/api/applications",{headers:{"x-admin-key":key}});
 const j=await r.json(); if(!r.ok){alert(j.message);return}
 const list=document.getElementById("list");
 list.innerHTML=j.applications.map(a=>card(a)).join("") || "<p class='muted'>No hay solicitudes.</p>";
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function card(a){
 const status={review:"🟡 REVISIÓN",approved:"🟢 ACEPTADO",rejected:"🔴 RECHAZADO"}[a.status]||a.status;
 return `<div class="card"><b>${esc(a.id)} — ${esc(a.robloxUsername)}</b> <span class="tag">${status}</span>
 <p>Edad: ${a.age}<br>Nivel Evade: ${a.evadeLevel}<br>Horas/semana: ${a.weeklyHours}<br>Otro clan: ${esc(a.otherClan)}<br><b>Motivo:</b> ${esc(a.reason)}</p>
 ${a.failures?.length?`<p style="color:#f87171"><b>Fallos:</b><br>${a.failures.map(esc).join("<br>")}</p>`:""}
 <textarea id="note-${a.id}" placeholder="Nota del administrador">${esc(a.adminNote)}</textarea>
 <input id="lobby-${a.id}" placeholder="Enlace del Lobby (opcional)" value="${esc(a.lobbyUrl||"")}">
 <input id="wa-${a.id}" placeholder="Enlace de WhatsApp (opcional)" value="${esc(a.whatsappUrl||"")}">
 <div class="actions">
 <button class="approve" onclick="setStatus('${a.id}','approved')">✅ ACEPTAR</button>
 <button class="reject" onclick="setStatus('${a.id}','rejected')">❌ RECHAZAR</button>
 <button onclick="setStatus('${a.id}','review')">🟡 DEJAR EN REVISIÓN</button>
 </div></div>`;
}
async function setStatus(id,status){
 const body={
  status,
  adminNote:document.getElementById("note-"+id).value,
  lobbyUrl:document.getElementById("lobby-"+id).value,
  whatsappUrl:document.getElementById("wa-"+id).value
 };
 const r=await fetch("/api/applications/"+id+"/status",{method:"POST",headers:{"Content-Type":"application/json","x-admin-key":key},body:JSON.stringify(body)});
 const j=await r.json();if(!r.ok){alert(j.message);return}
 load();
}
</script></body></html>
